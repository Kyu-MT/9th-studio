backend:
  name: git-gateway
  branch: main

media_folder: "9th-studio-website/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "settings"
    label: "网站设置"
    files:
      - name: "general"
        label: "基本设置"
        file: "9th-studio-website/content/settings.json"
        fields:
          - label: "委托档期状态"
            name: "commission_status"
            widget: "select"
            options:
              - { label: "开放委托", value: "open" }
              - { label: "额满", value: "full" }
              - { label: "暂停", value: "paused" }
          - label: "Logo 图片链接"
            name: "logo_url"
            widget: "string"
            required: false
            hint: "留空则使用默认 Logo"
          - label: "头像图片链接"
            name: "avatar_url"
            widget: "string"
            required: false
            hint: "留空则使用默认头像"
          - label: "网站名称"
            name: "site_name"
            widget: "string"
            hint: "显示在导航栏与页脚，例如 9th Studio"
          - label: "主理人显示名称"
            name: "display_name"
            widget: "string"
            hint: "显示在首屏的大标题中"
          - label: "首屏问候语（可选）"
            name: "hero_greeting"
            widget: "string"
            required: false
            hint: "留空则使用现有多语言文字"
          - label: "首屏副标题（可选）"
            name: "hero_subtitle"
            widget: "string"
            required: false
            hint: "留空则使用现有多语言文字"
          - label: "首屏简介（可选）"
            name: "hero_tagline"
            widget: "text"
            required: false
            hint: "留空则使用现有多语言文字"
          - label: "关于我标题（可选）"
            name: "about_title"
            widget: "string"
            required: false
          - label: "关于我副标题（可选）"
            name: "about_subtitle"
            widget: "string"
            required: false
          - label: "关于我第一段（可选）"
            name: "about_text_1"
            widget: "text"
            required: false
          - label: "关于我第二段（可选）"
            name: "about_text_2"
            widget: "text"
            required: false
          - label: "联系方式项目（可自由新增、删除及排序）"
            name: "contact_items"
            widget: "list"
            required: false
            summary: "{{fields.label}} — {{fields.value}}"
            hint: "可上传任意图标图片；也可用图标文字或 Emoji。链接可填写 https://、mailto: 或 tel:。"
            fields:
              - { label: "项目名称", name: "label", widget: "string", hint: "例如：Email、Discord、X、YouTube" }
              - { label: "显示内容", name: "value", widget: "string", hint: "例如：hello@example.com、@username" }
              - { label: "点击链接（可选）", name: "link", widget: "string", required: false, hint: "例如 mailto:hello@example.com、https://discord.gg/..." }
              - { label: "图标图片（可选）", name: "icon_image", widget: "image", required: false, hint: "上传 PNG、SVG 或 WebP 图标；有图片时会优先显示。" }
              - { label: "图标文字／Emoji（可选）", name: "icon_text", widget: "string", required: false, hint: "没有上传图标图片时使用，例如 ✉、◎、▶" }

  - name: "works"
    label: "作品展示"
    files:
      - name: "works"
        label: "作品列表"
        file: "9th-studio-website/content/works.json"
        fields:
          - label: "作品"
            name: "works"
            widget: "list"
            fields:
              - { label: "标题", name: "title", widget: "string" }
              - label: "分类"
                name: "category"
                widget: "select"
                options:
                  - { label: "VTuber 皮套", value: "vtuber" }
                  - { label: "Live2D 动画", value: "live2d" }
                  - { label: "角色立绘", value: "character" }
                  - { label: "插画", value: "illustration" }
                  - { label: "VTS 挂件", value: "vts" }
                  - { label: "表情包", value: "emoji" }
              - { label: "描述", name: "desc", widget: "text" }
              - label: "封面图片"
                name: "cover_image"
                widget: "image"
                required: false
                hint: "作品详情备用图片。建议上传或选择压缩过的 JPG/WebP 图片，而不是影片。"
              - label: "作品缩图（列表展示）"
                name: "thumbnail_image"
                widget: "image"
                required: false
                hint: "作品集手风琴列表优先显示此图。建议使用 4:3 或裁切清晰的 JPG/WebP 图片。"
              - label: "作品类型"
                name: "media_type"
                widget: "select"
                default: "video"
                options:
                  - { label: "影片（以链接播放）", value: "video" }
                  - { label: "图片作品", value: "image" }
              - label: "作品影片或图片链接"
                name: "media_url"
                widget: "string"
                required: false
                hint: "影片请贴上 YouTube、Vimeo 或 MP4 链接；图片作品可贴图片链接。不会上传大型影片。"
              - label: "使用技术"
                name: "tech"
                widget: "list"
                required: false
                field: { label: "技术名称", name: "tech", widget: "string" }

  - name: "testimonials"
    label: "客户评价"
    files:
      - name: "testimonials"
        label: "评价列表"
        file: "9th-studio-website/content/testimonials.json"
        fields:
          - label: "评价"
            name: "items"
            widget: "list"
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "客户名称", name: "name", widget: "string" }
              - { label: "身份／职业", name: "role", widget: "string", required: false }
              - { label: "头像显示字母", name: "initial", widget: "string", required: false, hint: "例如 A；留空会自动使用名称首字。" }
              - { label: "评价内容", name: "text", widget: "text" }

  - name: "pricing"
    label: "价目表"
    files:
      - name: "pricing"
        label: "价格列表"
        file: "9th-studio-website/content/pricing.json"
        fields:
          - label: "价格项目"
            name: "items"
            widget: "list"
            fields:
              - { label: "服务名称", name: "title", widget: "string" }
              - { label: "价格", name: "price", widget: "string", hint: "如 $500 或 面议" }
              - { label: "描述", name: "desc", widget: "text" }
